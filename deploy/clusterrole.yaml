apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spot-bidder
rules:
  # The bidder only reads the cluster: pending pods that tolerate the spot
  # taint (demand) and spot nodes plus the pods on them (usage, readiness).
  # All writes go to the Rackspace Spot API, never to Kubernetes.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
