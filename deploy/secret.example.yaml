# Example Secret holding the Rackspace Spot refresh token.
# Copy this to secret.yaml, replace the placeholder with your real refresh
# token, and apply with kubectl:
#
#   kubectl apply -f deploy/secret.yaml
#
# Or create it straight from the local token file:
#
#   kubectl -n kube-system create secret generic spot-bidder \
#     --from-file=SPOT_REFRESH_TOKEN=token
#
# Do NOT commit your real token. deploy/secret.yaml and token are in
# .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: spot-bidder
  namespace: kube-system
type: Opaque
stringData:
  SPOT_REFRESH_TOKEN: REPLACE_ME_WITH_YOUR_SPOT_REFRESH_TOKEN
