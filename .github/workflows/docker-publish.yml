name: publish-docker

# Build and publish the bidder image to GitHub Container Registry (ghcr.io)
# on every commit. Uses the built-in GITHUB_TOKEN, so no extra secrets are
# needed beyond enabling package writes for the repo (Settings → Actions →
# General → Workflow permissions → "Read and write permissions").
#
# Resulting image: ghcr.io/<owner>/<repo>[:tag], multi-arch (amd64 + arm64)
#   - <sha>          : the commit SHA (e.g. ghcr.io/owner/repo:sha-abc123)
#   - <branch>       : the branch name (sanitized)
#   - latest         : only on the repository's default branch
#   - <tag>          : git tags like v1.2.3 (overrides "latest")
#
# Each architecture is built natively and in parallel (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm) instead of emulating arm64 with
# QEMU on one runner, which was the slow part. Each build pushes its image by
# digest only (no tag); the "merge" job then creates the tagged multi-arch
# manifest list from both digests, so the registry never shows per-arch tags.
#
# Pull requests (including Dependabot's) are build-only: no registry login and
# no push. Their GITHUB_TOKEN is read-only — Dependabot- and fork-triggered runs
# cannot write packages — so attempting to log in would just fail the job.

on:
  push:
    # Dependabot pushes its branches into this repo, which would fire this
    # trigger with a read-only token; those commits are covered by the
    # pull_request trigger below instead.
    branches: ["**", "!dependabot/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  packages: write # required to push to ghcr.io (downgraded to read on PRs)

# Don't let a PR and its branch push (or rapid pushes) build the same ref twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Single source of truth for "this run may write to the registry".
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build${{ env.PUBLISH == 'true' && ' and push by digest' || ' (no push, pull request)' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          # One cache per architecture so the two jobs don't evict each other.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          provenance: false

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
